loaders:
    - type: python
      search_path: ['../python/geoengine']
      ignore_when_discovered: ['_deprecation']
processors:
    - type: filter
      skip_empty_modules: true
    - type: smart
    - type: crossref
renderer:
    type: docusaurus
    docs_base_path: src/content/docs/docs/
    relative_output_path: python
