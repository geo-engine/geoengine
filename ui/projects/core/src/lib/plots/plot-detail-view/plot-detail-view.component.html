<geoengine-dialog-header>{{ plot.name }}</geoengine-dialog-header>
<mat-dialog-content>
    @if (plotData.isLoading()) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    } @else {
        @switch (plotData.value().outputFormat) {
            @case ('ImagePng') {
                <img [src]="plotData.value().data" [alt]="plot.name" />
            }
            @case ('JsonPlain') {
                <pre>{{ plotData.value().data | json }}</pre>
            }
            @case ('JsonVega') {
                <geoengine-vega-viewer
                    [chartData]="plotData.value().data"
                    [width]="maxWidth()"
                    [height]="maxHeight()"
                ></geoengine-vega-viewer>
            }
            @default {
                <pre>{{ plotData.value().data }}</pre>
            }
        }
    }
</mat-dialog-content>
