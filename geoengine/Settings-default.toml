[web]
bind_address = "127.0.0.1:3030"
# set the path under which the api is served relative to the bind address
api_prefix = "/api"

# set the public address (typically ending in "/api") of the server, if it is different from the bind address
# external_address = "http://localhost:3030/api"

version_api = true

# HTTP worker threads, each with its own single-threaded Tokio runtime; 0 = one per core (actix default)
workers = 0
# max. blocking threads of each HTTP worker; 0 = max(512 / workers, 32)
max_blocking_threads_per_worker = 0

[project_service]
list_limit = 20

[dataset_service]
list_limit = 20
json_size_limit = 10240000 # 10MB

[layer_service]
list_limit = 20

[task_manager]
list_default_limit = 10
list_limit = 20

[postgres]
host = "localhost"
port = 5432
database = "geoengine"
schema = "geoengine"
user = "geoengine"
password = "geoengine"
# Set to `true` to start with a fresh database each time.
# If this parameter is set to `false` at the first start, subsequent changes to `true` will result in an error.
# This helps to protect production environments from unwanted data loss.
clear_database_on_start = false

[raster.tiling_specification]
tile_shape_pixels_x = 512
tile_shape_pixels_y = 512

[query_context]
chunk_byte_size = 1048576 # TODO: find reasonable default
# threads of the Rayon pool for the CPU-heavy work of operators; 0 = one per core
rayon_threads = 0
# GDAL tile reads a GdalSource query keeps in flight
gdal_source_read_ahead = 8
# GDAL tile reads a MultiBandGdalSource query keeps in flight
multi_band_gdal_source_read_ahead = 16

[expression]
# seconds a compiled expression stays in the cache without being requested; running queries keep
# theirs loaded in any case
library_idle_ttl_seconds = 900
# seconds between cleanup runs
library_sweep_interval_seconds = 30
# cache size for compiled expressions in MB, each takes about 4.4 MB in the workspace directory
library_cache_size_in_mb = 1_024
# directory for the build of the dependencies and the compiled expressions, about 90 MB + cache size;
# avoid the system's temp directory: its cleanup can delete files of a running server
workspace_path = "expression_workspace"
# max. expressions to compile at the same time, further requests wait; each runs one `rustc` process
max_concurrent_compilations = 8

[processing_runtime]
# Tokio worker threads of the runtime that runs the queries; 0 = one per core (or TOKIO_WORKER_THREADS)
worker_threads = 0
# max. threads of the Tokio blocking pool (spawn_blocking) of this runtime
max_blocking_threads = 512

[upload]
path = "upload"

[logging]
# Minimum log level. Can be one of error, warn, info, debug, trace
# Console and file logging uses the tokio tracing crate.
# The spec defined here is parsed using the tracing_subscriber::EnvFilter. This allows to use complex filter expressions.
# For example `info,geoengine_services=debug` will log all info messages and all debug messages from the "geoengine_services" crate.
# To get all info messages, all debug messages from crates prefixed with "geoengine", and all trace messages from "geoengine_operators" use: `info,geoengine=debug,geoengine_operators=trace`.
# See https://docs.rs/tracing-subscriber/latest/tracing_subscriber/ for more information.
log_spec = "info"

# Whether the logs should be also written to files.
# Log files are rotated once per day. The last 7 files will be kept.
log_to_file = false

# Changes the first part of the log filename.
filename_prefix = "geo_engine"

# By default logs are saved in the current working directory.
# Use this option if another folder should be used.
#log_directory = "/var/log/"

# Whether unshortened error messages should be logged.
# If true, messages will contain redundant information at the end of the line
# when the source is part of #[snafu(display())]. But in some cases this could
# improve debugging.
raw_error_messages = false

[ogc.default_time]
# type "Value" with start/end as ISO strings or "Now" for using the current time, use wcs.default_time etc. for override
type = "Value"
start = "2014-01-01T00:00:00Z"
end = "2014-01-01T00:00:00Z"

[ogc.cors]
allow_origin = "*"
allow_headers = ["Authorization", "Content-Type"]
allow_methods = ["GET", "OPTIONS", "HEAD"]

[wcs]
# max number of tiles to be produced for generating output tiff
tile_limit = 4
# request_timeout_seconds = 3600

[wms]
# request_timeout_seconds = 3600
max_image_width = 4096
max_image_height = 4096

[wfs]
# request_timeout_seconds = 3600

[plots]
# request_timeout_seconds = 3600

[dataprovider]
# Optional key material for AES-256-GCM encryption of STAC credentials in PostgreSQL.
# Without a key, credentials are stored as unencrypted UTF-8 bytes with no nonce.
# Existing plaintext credentials remain readable after enabling encryption and are
# encrypted on their next update.
# Keep this key stable and backed up separately from the database. Changing or removing
# it makes encrypted credentials unreadable. Restart the service after configuring it.
# Prefer GEOENGINE__DATAPROVIDER__PASSWORD_ENCRYPTION_KEY for deployment secrets.
# password_encryption_key = "replace-with-a-long-random-secret"
dataset_defs_path = "./test_data/dataset_defs"
provider_defs_path = "./test_data/provider_defs"
layer_defs_path = "./test_data/layer_defs"
layer_collection_defs_path = "./test_data/layer_collection_defs"

[gdal_process_pool]
# GDAL worker processes. Each keeps its last dataset open, so idle workers act as a cache: with
# many files (e.g. one per scene and band), more processes reuse more open datasets, at the cost
# of memory per process.
number_of_processes = 32
# Max. concurrent GDAL reads. More is not necessarily faster: parallel reads of one file spread
# its cache over more processes, and fewer active reads leave more idle workers as cache.
max_active_processes = 16
# Max. concurrent reads of a single dataset. Keeps one file from occupying all workers and
# evicting the other datasets they hold open.
max_dataset_processes = 8
# Number of file headers (levels, block sizes) kept for reads through cached file blocks, one per
# file and band, so that tiles do not wait for a worker to read a header again.
header_cache_entries = 4096

[gdal]
# TODO: find good default
# Use 0 for `ALL_CPUS` option or a number >0 for a specific number of threads.
compression_num_threads = 8
compression_z_level = 6
compression_algorithm = "LZW"
allowed_drivers = [
    "COG",
    "CSV",
    "ESRI Shapefile",
    "FlatGeobuf",
    "GeoJSON",
    "GeoJSONSeq",
    "GPKG",
    "GTiff",
    "HDF4",
    "HDF5Image",
    "HTTP",
    "JP2OpenJPEG",
    "KML",
    "MEM",
    "MSGN",
    "netCDF",
    "OGCAPI",
    "OSM",
    "PNG",
    "PostGISRaster",
    "PostgreSQL",
    "SAFE",
    "SENTINEL2",
    "SQLite",
    "STACIT",
    "TopoJSON",
    "WCS",
    "WFS",
    "WMTS",
    "XLS",
    "XLSX",
    "Zarr",
    "GPX",
]

[session]
# Whether to allow requests to `/anonymous` that return a valid session.
anonymous_access = true
# fixed_session_id = "00000000-0000-0000-0000-000000000000" # If set, all requests will use this session ID. Useful for testing.

[user]
registration = true
admin_email = "admin@localhost"
admin_password = "adminadmin"   # Initial password for the user "admin", which is created on startup

[quota]
mode = "disabled" # "disabled", "track", "check"
# initial_credits = 9999
increment_quota_buffer_size = 100           # number of quota updates to buffer before sending them to the database
increment_quota_buffer_timeout_seconds = 60 # number of seconds after which the quota updates are sent to the database

# Settings for compile-feature `nfdi` only
[gfbio]
# This is the basket API endpoint
basket_api_base_url = "https://dev.gfbio.uni-jena.de/daisi-api/api/baskets/"
# If this is set to true, basket entries that belong to the
# same dataset AND species are grouped within a single layer.
# This is the behaviour of the old VAT system.
# If false, every basket entry translates into a layer on the map.
group_abcd_units = true

[oidc]
enabled = false
issuer = "https://auth.geoengine.io"
client_id = ""
client_secret = ""
scopes = []

[open_telemetry]
enabled = false
endpoint = "http://127.0.0.1:4317"

[gdal_process_pool.worker]
# Threads of the OpenBLAS and OpenMP pools in each worker process. GDAL links them via Armadillo,
# and a threaded OpenBLAS otherwise starts one idle thread per core in every worker. GDAL reads do
# not use them.
blas_threads = 1

[gdal_process_pool.worker.gdal_config_options]
# Process-global GDAL config options applied once when a GDAL worker process starts.
#
# Two categories:
# 1. Frozen at first /vsicurl/ use (changing these requires restarting the worker process):
#    - CPL_VSIL_CURL_CHUNK_SIZE
#    - CPL_VSIL_CURL_CACHE_SIZE
# 2. Read per dataset open or request (can also be overridden per dataset via its
#    gdal_config_options, which apply while the dataset is open, i.e. also to its reads):
#    - VSI_CACHE, VSI_CACHE_SIZE
#    - GDAL_DISABLE_READDIR_ON_OPEN
#    - CPL_VSIL_CURL_ALLOWED_EXTENSIONS
#    - GDAL_HTTP_LOW_SPEED_LIMIT, GDAL_HTTP_LOW_SPEED_TIME, GDAL_HTTP_CONNECTTIMEOUT
#
# Every worker process has its own caches, so the GDAL memory bound of the pool is about
# number_of_processes * (GDAL_CACHEMAX + VSI_CACHE_SIZE + CPL_VSIL_CURL_CACHE_SIZE (default 16mb)).
GDAL_DISABLE_READDIR_ON_OPEN = "EMPTY_DIR"
CPL_VSIL_CURL_ALLOWED_EXTENSIONS = ".tif,.tiff,.TIF,.jp2,.ovr"
CPL_VSIL_CURL_CHUNK_SIZE = "1048576" # 1mb TODO: need to tune this!
VSI_CACHE = "TRUE"
VSI_CACHE_SIZE = "67108864" # 64mb per open file; a worker keeps one file open
# block cache in mb per worker; without it, GDAL uses 5% of the RAM per worker process. With
# `[cache] enable_new_raster_cache`, decoded blocks are cached once in the server instead of in
# every worker, so this can be lowered, e.g. to "64".
GDAL_CACHEMAX = "256"
# Abort HTTP transfers that stall (below LIMIT bytes/s for TIME seconds), otherwise a hanging
# remote blocks a worker forever. Unlike a total timeout (GDAL_HTTP_TIMEOUT), this does not abort
# slow transfers that still make progress.
GDAL_HTTP_LOW_SPEED_LIMIT = "1024"
GDAL_HTTP_LOW_SPEED_TIME = "30"
GDAL_HTTP_CONNECTTIMEOUT = "10"
# Decode with one thread per worker: the pool already runs one read per worker in parallel, and
# JP2OpenJPEG would otherwise start a thread per CPU in every worker.
GDAL_NUM_THREADS = "1"

[gdal_process_pool.worker.logging]
# Logging for the GDAL worker processes. Independent from the main `[logging]` section because
# there are many worker processes and their log volume differs from the main process.
# Must include `gdalsource_process` (the binary crate) to export worker-level spans.
log_spec = "gdalsource_process=info,geoengine=info,info"
log_to_file = false
filename_prefix = "geo_engine_worker"
# log_directory = "/var/log/"

[gdal_process_pool.worker.open_telemetry]
enabled = false
endpoint = "http://127.0.0.1:4317"

[data]
volumes = { test_data = "test_data/" }

[cache]
enabled = false
# Default cache lifetime in seconds for values without an explicit TTL (0 disables caching).
default_ttl_seconds = 0
# storage limit for the cache
size_in_mb = 1_000 # 1 GB
# storage limit for collecting query results before insertion into the cache in
landing_zone_ratio = 0.1 # 10% of total cache size
# use the new raster cache implementation for raster data instead of the old cache
enable_new_raster_cache = false
# if `enable_new_raster_cache` is set, the fraction of `size_in_mb` reserved for the new raster
# cache; the remainder is used by the old cache (which then only holds vector data).
# Ignored if `enable_new_raster_cache` is `false`, in which case the old cache holds both
# vector and raster data and gets the full `size_in_mb`.
raster_cache_size_ratio = 0.5
# names of the raster operators whose tiles the new raster cache stores, "*" for all. GDAL sources
# that read through file blocks are not wrapped, as the blocks are cached already. Set this list in
# a settings file: as an environment variable, it stops the server at startup.
raster_operators = ["*"]
# With `enable_new_raster_cache`, the least time in seconds that file blocks and headers stay cached,
# also for data whose TTL is shorter or 0, so that the tiles of a view share them. The server warns
# at startup if `default_ttl_seconds` is lower. With 0, data with a TTL of 0 is read in windows.
min_block_ttl_seconds = 60

[stac_cache]
# maximum size of the STAC query cache in MB
size_in_mb = 100
# TTL in seconds for STAC query cache entries
ttl_secs = 3600

[provider_cache]
# maximum number of provider instances in the provider registry
max_entries = 256
# maximum idle time in seconds before evicting a cached provider
max_idle_secs = 1800

[wildlive]
api_endpoint = "https://wildlive.senckenberg.de/api/"

[wildlive.oidc]
issuer = "https://webapp.senckenberg.de/auth/realms/wildlive-portal"
client_id = "geoengine"
client_secret = ""
broker_provider = "wildlive-portal"
