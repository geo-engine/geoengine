[postgres]
host = "localhost"
port = 5432
database = "geoengine"
schema = "pg_temp"     # we need the right to create new schemata for tests
user = "geoengine"
password = "geoengine"

[operators.gdal_source]
raster_data_root_path = "../test_data/raster" # relative to sub crate directory for tests

[raster.tiling_specification]
tile_shape_pixels_x = 512
tile_shape_pixels_y = 512

[upload]
path = "test_upload"

[oidc]
enabled = true
issuer = "http://localhost"
client_id = ""
client_secret = ""
redirect_uri = ""
scopes = []

[user]
admin_email = "admin@localhost"
admin_password = "admin"

[quota]
mode = "check"
initial_credits = 9999
increment_quota_buffer_size = 0             # number of quota updates to buffer before sending them to the database
increment_quota_buffer_timeout_seconds = 60 # number of seconds after which the quota updates are sent to the database

[cache]
enabled = false
# storage limit for the cache
size_in_mb = 1_000 # 1 GB
# storage limit for collecting query results before insertion into the cache in
landing_zone_ratio = 0.1 # 10% of total cache size
# use the new raster cache implementation for raster data instead of the old cache
enable_new_raster_cache = false
# if `enable_new_raster_cache` is set, the fraction of `size_in_mb` reserved for the new raster
# cache; the remainder is used by the old cache (which then only holds vector data).
# Ignored if `enable_new_raster_cache` is `false`, in which case the old cache holds both
# vector and raster data and gets the full `size_in_mb`.
raster_cache_size_ratio = 0.5

[gdal_process_pool]
number_of_processes = 2
max_active_processes = 2
max_dataset_processes = 2
