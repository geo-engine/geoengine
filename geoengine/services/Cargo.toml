[package]
name = "geoengine-services"
version.workspace = true
authors.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true
documentation.workspace = true
repository.workspace = true
build = "build.rs"
default-run = "geoengine-server"

[lib]
bench = false

[[bench]]
name = "stac_grid"
harness = false

[[bench]]
name = "map_tile"
harness = false

[[bin]]
name = "geoengine-server"
path = "src/bin/geoengine-server.rs"
bench = false

[[bin]]
name = "geoengine-cli"
path = "src/bin/geoengine-cli.rs"
bench = false

[features]
# logs Tokio runtime metrics every second, see `README.md`
runtime-metrics = ["dep:tokio-metrics"]

[dependencies]
actix-files = { workspace = true }
actix-http = { workspace = true }
actix-multipart = { workspace = true }
actix-rt = { workspace = true }
actix-web = { workspace = true }
actix-web-httpauth = { workspace = true }
actix-ws = { workspace = true }
aes-gcm = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bb8-postgres = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
convert_case = { workspace = true }
dashmap = { workspace = true }
erased-serde = { workspace = true }
flexi_logger = { workspace = true }
float-cmp = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
gdal = { workspace = true }
geo = { workspace = true }
geoengine-api-client = { path = "../../api-clients/rust" }
geoengine-datatypes = { path = "../datatypes" }
geoengine-expression = { path = "../expression" }
geoengine-macros = { path = "../macros" }
geoengine-operators = { path = "../operators" }
geojson = { workspace = true }
itertools = { workspace = true }
mime = { workspace = true }
moka = { workspace = true }
num-traits = { workspace = true }
oauth2 = { workspace = true }
ogcapi-types = { workspace = true }
openidconnect = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
ort = { workspace = true }
paste = { workspace = true }
pbkdf2 = { workspace = true }
postgres-protocol = { workspace = true }
postgres-types = { workspace = true }
proj = { workspace = true }
proj-sys = { workspace = true }
pwhash = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
stac = { workspace = true }
stac-extensions = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tokio = { workspace = true }
tokio-metrics = { workspace = true, optional = true }
tokio-postgres = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-actix-web = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
typed_floats = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
walkdir = { workspace = true }
wkt = { workspace = true }
zip = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["socket"] }

[dev-dependencies]
assert_cmd = { workspace = true }
criterion = { workspace = true }
csv = { workspace = true }
httptest = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
xml = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
vergen = { workspace = true, features = ["build", "cargo", "emit_and_set"] }
vergen-gitcl = { workspace = true, features = ["build"] }

[lints]
workspace = true
