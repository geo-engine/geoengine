version: 2

updates:
  - package-ecosystem: "cargo"
    # Look for `Cargo.toml` and `lock` files in the `root` directory
    directory: "/geoengine"
    # Check the `crates.io` for updates every day (weekdays)
    schedule:
      interval: "weekly"
      day: "sunday" # to be checked before Monday
    # Conventional commit prefix, scope must be allowed by .github/workflows/lint-pr-title.yml
    commit-message:
      prefix: "build(backend)"
    groups:
      # One pull request per directory for all version updates
      all:
        patterns:
          - "*"
      # Security updates ignore the groups above, so they need their own group
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/python"
    # Check the `crates.io` for updates every day (weekdays)
    schedule:
      interval: "weekly"
      day: "sunday" # to be checked before Monday
    # Conventional commit prefix, scope must be allowed by .github/workflows/lint-pr-title.yml
    commit-message:
      prefix: "build(python)"
      prefix-development: "build(python)"
    groups:
      # One pull request per directory for all version updates
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday" # to be checked before Monday
    # Conventional commit prefix, scope must be allowed by .github/workflows/lint-pr-title.yml
    commit-message:
      prefix: "ci"
    groups:
      # One pull request per directory for all version updates
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/ui"
    # Check the `crates.io` for updates every day (weekdays)
    schedule:
      interval: "weekly"
      day: "sunday" # to be checked before Monday
    # Conventional commit prefix, scope must be allowed by .github/workflows/lint-pr-title.yml
    commit-message:
      prefix: "build(ui)"
      prefix-development: "build(ui)"
    groups:
      # One pull request per directory for all version updates
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Wait a week before proposing new versions (does not delay security updates)
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/www"
    schedule:
      interval: "weekly"
      day: "sunday" # to be checked before Monday
    # Conventional commit prefix, scope must be allowed by .github/workflows/lint-pr-title.yml
    commit-message:
      prefix: "build(www)"
      prefix-development: "build(www)"
    groups:
      # One pull request per directory for all version updates
      all:
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Wait a week before proposing new versions (does not delay security updates)
    cooldown:
      default-days: 7

  # Test data only: suppress all updates, including security updates
  - package-ecosystem: "npm"
    directory: "/geoengine/test_data/ogc/tiles/openlayers"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
